<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LISTADO DE TAREAS</title>
</head>
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="output.css">

<script src="app.js" defer></script>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-white font-sans ">
    
    <button id="boton-dark" aria-label="Alternar modo oscuro" class="px-4 py-2 bg-gray-300 dark:bg-gray-700 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400 transition">ALTERNAR MODO OSCURO</button>
    
    <header class="bg-gray-100 dark:bg-gray-900 p-4 shadow mb-4">
        <h1 class="text-3xl font-bold text-blue-600 dark:text-white text-center">
            LISTADO DE TAREAS</h1>
    </header>
    <!--Contenedor principal-->
    <div class="flex flex-col md:flex-row min-h-screen justify-center">
        <aside class="w-52 md:w-64 lg:w-72 p-4 bg-purple-200 dark:bg-purple-800 rounded">
            <h2  class="font-semibold mb-4">Categorias</h2>
            <ul>
                <li class="bg-white dark:bg-gray-700 p-2 rounded border border-gray-300 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600">Profesional</li>
                <li class="bg-white dark:bg-gray-700 p-2 rounded border border-gray-300 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600">Finanzas</li>
                <li class="bg-white dark:bg-gray-700 p-2 rounded border border-gray-300 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600">Salud</li>
                <li class="bg-white dark:bg-gray-700 p-2 rounded border border-gray-300 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600">Personal</li>
            </ul>
    </aside>
    <!--LISTADO DE TAERAS-->

    <!-- BUSCAR UNA TAREA-->
    <main class="flex-1 p-6 max-w-6xl w-full mx-auto">
        <form id="form-buscar" class="mt-4 flex-col md:flex-row gap-2" aria-label="Formulario de búsqueda y filtros">
        <label for="input-buscar" class="sr-only">Buscar tarea</label>
        <input 
        type="text"
        id="input-buscar"
        placeholder="Buscar tarea..."
        class="p-2 border rounded w-full mb-2
        bg-white dark:bg-gray-700
        text-gray-900 dark:text-white
        focus:ring-2 focus:ring-blue-500 transition">

        <label for="filtroCategoria" class="sr-only">Filtrar por categoría</label>
        <select id="filtroCategoria" class="p-2 border rounded bg-white dark:bg-gray-700">
                <option value="">Todas</option>
                <option value="Profesional">Profesional</option>
                <option value="Finanzas">Finanzas</option>
                <option value="Salud">Salud</option>
                <option value="Personal">Personal</option>
             </select> 

             <label for="filtroPrioridad" class="sr-only">Filtrar por prioridad</label>
             <select id="filtroPrioridad" class="p-2 border rounded bg-white dark:bg-gray-700">
                <option value="">Todas</option>
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
        </select>

        <label for="filtroEstado" class="sr-only">Filtrar por estado</label>
        <select id="filtroEstado" class="p-2 border rounded bg-white dark:bg-gray-700">
                <option value="">Todas</option>
                <option value="pendiente">Pendientes</option>
                <option value="completada">Completadas</option>
        </select>
                    
        <button type="submit" aria-label="Buscar tareas" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 transition">Buscar</button>


        <p id="sin-coincidencias" role="status" aria-live="polite"
        style="display: none;">No hay tareas que coincidan</p>
       </form>

    <!-- CREAR UNA NUEVA TAREA-->
        <form id="form-tarea" class="mt-4 flex-col md:flex-row gap-2" aria-label="Formulario para añadir tareas"> 
            <label for="input-tarea" class="sr-only">Descripción de la tarea</label>
            <input 
            type="text" 
            class="p-2 border rounded w-full md:flex-1 bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 transition" 
            id="input-tarea" 
            placeholder="Escribe una tarea nueva">

            <label for="categoria" class="sr-only">Categoría</label>
            <select id="categoria" class="p-2 border rounded bg-white dark:bg-gray-700">
                <option value="Profesional">Profesional</option>
                <option value="Finanzas">Finanzas</option>
                <option value="Salud">Salud</option>
                <option value="Personal">Personal</option>
             </select> <!--con esto le damos la opcion a añadir categorias y después la prioridad-->

             <label for="prioridad" class="sr-only">Prioridad</label>
             <select id="prioridad" class="p-2 border rounded bg-white dark:bg-gray-700">
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>
            
            <button type="submit" aria-label="Añadir tarea" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 transition">Añadir</button>
        </form>

    <!--LISTADO DE TAREAS-->
        <h2 class="text-xl font-bold mt-6">TAREAS</h2>
        <section id= "lista-tareas" class="space-y-3"></section>
        <button id="completar-todas" aria-label="Completar todas las tareas" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-blue-400 transition mt-2">Completar todas las tareas</button>
    
    <!--TAREAS COMPLETADAS-->
        <h2 class="text-xl font-bold mt-8 border-t pt-4">TAREAS COMPLETADAS</h2>
        <section id="lista-completadas" class="space-y-3"></section>
        <button id="eliminar-completadas" aria-label="Eliminar todas las tareas completadas" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-blue-400 transition mt-2">Eliminar todas las completadas</button>
    
    </main>
    </div>
</body>
</html>
