<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listado de Tareas</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="api/clients.js" defer></script> <!--LLAMAMOS PRIMERO A API CLIENT.JS PARA PODER HACER TODAS LAS FUNCIONES EN APP.JS. Con DEFER hacemos lo mismo pero para el html-->  
  
</head>
<body>

  <!-- MODAL EDITAR -->
  <dialog id="modal-editar" class="modal-dialogo">
    <form method="dialog" class="modal-caja">
      <p class="modal-h">Editar tarea</p>

      <label class="modal-label" for="modal-editar-texto">Descripción</label>
      <input class="modal-input" id="modal-editar-texto" type="text" required />

      <label class="modal-label" for="modal-editar-prioridad">Prioridad</label>
      <select class="modal-select" id="modal-editar-prioridad">
        <option value="Alta">Alta</option>
        <option value="Media">Media</option>
        <option value="Baja">Baja</option>
      </select>

      <div class="modal-btns">
        <button class="mbtn-cancel" id="modal-editar-cancelar" type="button">Cancelar</button>
        <button class="mbtn-save"   id="modal-editar-guardar"  type="button">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" id="boton-menu" aria-label="Abrir menú de categorías">
        <span></span><span></span><span></span>
      </button>
      <span class="brand">Mis <span>Tareas</span></span>
    </div>
    <div class="topbar-right">
      <button class="dark-btn" id="boton-dark" aria-label="Alternar modo oscuro">☾ Modo oscuro</button>
    </div>
  </header>

  <!-- OVERLAY SIDEBAR (móvil) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- WRAPPER -->
  <div class="page-wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <p class="sidebar-title">Categorías</p>
      <ul>
        <li class="cat-item"><span class="cat-dot" style="background:#6A8FAD"></span>Profesional</li>
        <li class="cat-item"><span class="cat-dot" style="background:#A08050"></span>Finanzas</li>
        <li class="cat-item"><span class="cat-dot" style="background:#5A9478"></span>Salud</li>
        <li class="cat-item"><span class="cat-dot" style="background:#8A6AAD"></span>Personal</li>
      </ul>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- BUSCAR Y FILTRAR -->
      <form id="form-buscar" class="bloque" aria-label="Formulario de búsqueda y filtros">
        <div class="search-row">
          <label for="input-buscar" class="sr-only">Buscar tarea</label>
          <input type="text" id="input-buscar" placeholder="Buscar tarea..." />
          <button type="submit" class="btn-accion-principal">Buscar</button>
        </div>
        <div class="filters-row">
          <label for="filtroCategoria" class="sr-only">Filtrar por categoría</label>
          <select id="filtroCategoria">
            <option value="">Todas las categorías</option>
            <option value="Profesional">Profesional</option>
            <option value="Finanzas">Finanzas</option>
            <option value="Salud">Salud</option>
            <option value="Personal">Personal</option>
          </select>

          <label for="filtroPrioridad" class="sr-only">Filtrar por prioridad</label>
          <select id="filtroPrioridad">
            <option value="">Todas las prioridades</option>
            <option value="Alta">Alta</option>
            <option value="Media">Media</option>
            <option value="Baja">Baja</option>
          </select>

          <label for="filtroEstado" class="sr-only">Filtrar por estado</label>
          <select id="filtroEstado">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendientes</option>
            <option value="completada">Completadas</option>
          </select>
        </div>
        <p id="sin-coincidencias" class="no-coin" role="status" aria-live="polite" style="display:none;">
          Sin resultados para esa búsqueda.
        </p>
      </form>

      <!-- AÑADIR TAREA -->
      <form id="form-tarea" class="bloque" aria-label="Formulario para añadir tareas">
        <p class="bloque-titulo">Nueva tarea</p>
        <div class="add-row">
          <label for="input-tarea" class="sr-only">Descripción de la tarea</label>
          <input type="text" id="input-tarea" placeholder="Escribe la descripción..." />

          <label for="categoria" class="sr-only">Categoría</label>
          <select id="categoria">
            <option value="Profesional">Profesional</option>
            <option value="Finanzas">Finanzas</option>
            <option value="Salud">Salud</option>
            <option value="Personal">Personal</option>
          </select>

          <label for="prioridad" class="sr-only">Prioridad</label>
          <select id="prioridad">
            <option value="Alta">Alta</option>
            <option value="Media">Media</option>
            <option value="Baja">Baja</option>
          </select>

          <button type="submit" class="btn-accion-principal" aria-label="Añadir tarea">Añadir</button>
        </div>
      </form>

      <!-- PENDIENTES -->
      <div class="section-head">
        <h2 class="section-title">Pendientes <span class="section-count" id="cnt-pendientes">0</span></h2>
        <button id="completar-todas" class="btn-seccion-verde" aria-label="Completar todas las tareas">Completar todas</button>
      </div>
      <section id="lista-tareas" aria-label="Lista de tareas pendientes"></section>

      <!-- COMPLETADAS -->
      <div class="sep">
        <div class="section-head">
          <h2 class="section-title">Completadas <span class="section-count" id="cnt-completadas">0</span></h2>
          <button id="eliminar-completadas" class="btn-seccion-rojo" aria-label="Eliminar todas las tareas completadas">Eliminar todas</button>
        </div>
        <section id="lista-completadas" aria-label="Lista de tareas completadas"></section>
      </div>

    </main>
  </div>
    <script src="app.js"></script>
</body>
</html>
